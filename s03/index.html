<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 점심 추천 앱</title>
  <style>
    /* ==========================================
       CSS 스타일링 (디자인 & 테두리 & 배치)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Casual', sans-serif;
    }

    body {
      background-color: #f5eedc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 모바일 프레임 규격 */
    .app-container {
      width: 360px;
      height: 640px;
      background-color: #fff9eb;
      border: 3px solid #2b2b2b;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 화면 스크린 (기본적으로 숨김 처리) */
    .screen {
      display: none;
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      flex-direction: column;
    }

    /* 활성화된 화면만 표시 */
    .screen.active {
      display: flex;
    }

    /* 공통 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #2b2b2b;
      margin-bottom: 5px;
    }

    /* 헤더 하단 무작위 뽑기 안내문 */
    .header-subtext {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
      font-weight: normal;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    /* ==========================================
       [화면 1] 메인 뽑기 화면
       ========================================== */
    .slot-machine {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
      background-color: #2b2b2b;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .slot-item {
      background-color: #fff;
      height: 85px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      border: 2px solid #2b2b2b;
    }

    .slot-item .food-name {
      font-size: 11px;
      font-weight: bold;
      color: #333;
      margin-top: 2px;
    }

    .slot-item.highlight {
      background-color: #ffb703;
      border: 3px solid #d48800;
    }

    .main-draw-btn {
      background-color: #ffb703;
      color: #2b2b2b;
      border: 3px solid #2b2b2b;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #2b2b2b;
      transition: transform 0.1s;
    }

    .main-draw-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* 현재 적용된 필터 상태 표시 */
    .filter-status {
      font-size: 11px;
      color: #d97706;
      background-color: #fef3c7;
      border: 1px dashed #d97706;
      border-radius: 6px;
      padding: 6px 10px;
      margin-top: 10px;
      text-align: center;
    }

    /* ==========================================
       [화면 2] 조건 설정 화면
       ========================================== */
    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #2b2b2b;
    }

    .input-box {
      width: 100%;
      height: 48px;
      background-color: #fff;
      border: 2px solid #2b2b2b;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      outline: none;
      resize: none;
    }

    /* ==========================================
       [화면 3] 음식 상세 및 맛집 위치 화면
       ========================================== */
    .food-img-card {
      width: 100%;
      height: 130px;
      background-color: #ffb703;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 15px;
    }

    .food-img-card .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      border: 2px solid #2b2b2b;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .food-img-card .icon {
      font-size: 50px;
    }

    .food-img-card .title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 2px;
    }

    .rating-section-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .restaurant-card {
      background-color: #fff;
      border: 2px solid #2b2b2b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .restaurant-name {
      font-weight: bold;
      font-size: 15px;
      color: #2b2b2b;
    }

    .restaurant-location {
      font-size: 12px;
      color: #d97706;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ==========================================
       하단 네비게이션 바
       ========================================== */
    .navbar {
      height: 60px;
      border-top: 3px solid #2b2b2b;
      background-color: #fff9eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #2b2b2b;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ==================== 화면 1: 오늘의 점심 ==================== -->
    <div id="screen1" class="screen active">
      <div class="header">
        <span>🧁 오늘의 점심</span>
        <button class="icon-btn" onclick="navigateTo('screen2')">⚙️</button>
      </div>
      <div class="header-subtext">버튼을 누르면 결정장애 해결! 무작위 점심 메뉴 뽑기 🎯</div>

      <!-- 3x3 슬롯 그리드 -->
      <div class="slot-machine" id="slot-grid">
        <div class="slot-item"><span>🍕</span><span class="food-name">피자</span></div>
        <div class="slot-item"><span>🍗</span><span class="food-name">치킨</span></div>
        <div class="slot-item"><span>🍣</span><span class="food-name">초밥</span></div>
        <div class="slot-item"><span>🍔</span><span class="food-name">햄버거</span></div>
        <div class="slot-item highlight" id="center-slot"><span>🍲</span><span class="food-name">부대찌개</span></div>
        <div class="slot-item"><span>🍜</span><span class="food-name">라멘</span></div>
        <div class="slot-item"><span>🌮</span><span class="food-name">타코</span></div>
        <div class="slot-item"><span>🥩</span><span class="food-name">돈까스</span></div>
        <div class="slot-item"><span>🥘</span><span class="food-name">떡볶이</span></div>
      </div>

      <button class="main-draw-btn" onclick="drawLunch()">오늘의 점심 뽑기 🎰</button>
      
      <div class="filter-status" id="filter-status-text">
        💡 조건 설정에 따라 후보 메뉴가 자동으로 조정됩니다.
      </div>
    </div>

    <!-- ==================== 화면 2: 식사 정보/선호도 설정 ==================== -->
    <div id="screen2" class="screen">
      <div class="header">
        <span>⚙️ 메뉴 조건 설정</span>
        <button class="icon-btn" onclick="applySettingsAndReturn()">✔ 완료</button>
      </div>
      <div class="header-subtext">제외하거나 추천 확률을 높일 단어를 적어주세요.</div>

      <div class="input-group">
        <label>어제 먹은 음식 (제외)</label>
        <textarea id="input-yesterday" class="input-box" placeholder="예: 돈까스, 피자"></textarea>
      </div>

      <div class="input-group">
        <label>알레르기 음식 (제외)</label>
        <textarea id="input-allergy" class="input-box" placeholder="예: 타코, 마라탕"></textarea>
      </div>

      <div class="input-group">
        <label>비선호 음식 (제외)</label>
        <textarea id="input-dislike" class="input-box" placeholder="예: 떡볶이, 햄버거"></textarea>
      </div>

      <div class="input-group">
        <label>선호 음식 (우선추천 ⭐)</label>
        <textarea id="input-like" class="input-box" placeholder="예: 초밥, 라멘, 치킨"></textarea>
      </div>
    </div>

    <!-- ==================== 화면 3: 선정된 음식 및 맛집 위치 정보 ==================== -->
    <div id="screen3" class="screen">
      <div class="header">
        <span>음식 상세</span>
        <button class="icon-btn" onclick="navigateTo('screen1')">🏠</button>
      </div>
      <div class="header-subtext">추천된 점심 메뉴와 대표 맛집 위치 정보입니다.</div>

      <div class="food-img-card">
        <span class="badge">오늘 선정된 음식</span>
        <span class="icon" id="detail-food-icon">🍕</span>
        <span class="title" id="detail-food-name">피자</span>
      </div>

      <div class="rating-section-title">📍 국내 추천 맛집 위치</div>

      <div id="restaurant-list">
        <!-- 맛집 이름과 실제 위치가 JS로 랜더링됩니다 -->
      </div>
    </div>

    <!-- ==================== 하단 네비게이션 ==================== -->
    <div class="navbar">
      <button class="nav-btn" onclick="navigateTo('screen1')" title="뽑기">🎰</button>
      <button class="nav-btn" onclick="navigateTo('screen2')" title="설정">🔄</button>
      <button class="nav-btn" onclick="navigateTo('screen3')" title="상세">🔍</button>
    </div>

  </div>

  <!-- ==========================================
       JavaScript 로직 (맛집 위치 데이터 표현)
       ========================================== -->
  <script>
    // 국내 대표 맛집과 실제 위치(지역/주소) 데이터
    const fullFoodDatabase = [
      { 
        name: '피자', 
        icon: '🍕', 
        restaurants: [
          { name: '잭슨피자 한남점', location: '서울 용산구 이태원로 274' },
          { name: '보니스피자펍', location: '서울 용산구 신흥로 3길 2' },
          { name: '매덕스피자', location: '서울 강남구 도산대로15길 11' }
        ] 
      },
      { 
        name: '치킨', 
        icon: '🍗', 
        restaurants: [
          { name: '계열사 본점', location: '서울 종로구 백석동길 7 (부암동)' },
          { name: '한성치킨', location: '경기 김포시 양촌읍 김포한강4로 327' },
          { name: '효도치킨 광화문점', location: '서울 종로구 사직로8길 21.1' }
        ] 
      },
      { 
        name: '초밥', 
        icon: '🍣', 
        restaurants: [
          { name: '스시소라 대치점', location: '서울 강남구 삼성로 85길 33' },
          { name: '상무초밥 강남점', location: '서울 서초구 강남대로 455' },
          { name: '박용석스시 홍대점', location: '서울 마포구 양화로 6길 57' }
        ] 
      },
      { 
        name: '햄버거', 
        icon: '🍔', 
        restaurants: [
          { name: '다운타운너 청담점', location: '서울 강남구 도산대로54길 12' },
          { name: '바스버거 성수점', location: '서울 성동구 아차산로 9길 12' },
          { name: '브루클린 더 버거조인트', location: '서울 서초구 서래로2길 27' }
        ] 
      },
      { 
        name: '라멘', 
        icon: '🍜', 
        restaurants: [
          { name: '오레노라멘 합정본점', location: '서울 마포구 독막로6길 14' },
          { name: '멘야하나비 잠실점', location: '서울 송파구 백제고분로45길 38' },
          { name: '부탄츄 신촌점', location: '서울 서대문구 연세로7길 26' }
        ] 
      },
      { 
        name: '타코', 
        icon: '🌮', 
        restaurants: [
          { name: '갓잇 송리단길점', location: '서울 송파구 백제고분로45길 4-14' },
          { name: '바토스 이태원점', location: '서울 용산구 이태원로 15길 1' },
          { name: '비야게레로', location: '서울 강남구 봉은사로78길 12 (삼성동)' }
        ] 
      },
      { 
        name: '돈까스', 
        icon: '🥩', 
        restaurants: [
          { name: '정돈 대학로본점', location: '서울 종로구 대학로9길 12' },
          { name: '크레이지카츠', location: '서울 마포구 포은로2나길 44 (합정)' },
          { name: '한성돈까스', location: '서울 서초구 강남대로97길 16' }
        ] 
      },
      { 
        name: '마라탕', 
        icon: '🍲', 
        restaurants: [
          { name: '하오마라 강남점', location: '서울 강남구 강남대로96길 12' },
          { name: '손오공마라탕 홍대점', location: '서울 마포구 홍익로 10' }
        ] 
      },
      { 
        name: '떡볶이', 
        icon: '🥘', 
        restaurants: [
          { name: '애플하우스 이수점', location: '서울 동작구 동작대로27길 31' },
          { name: '루비떡볶이', location: '서울 강남구 압구정로50길 28' },
          { name: '풍년쌀농산', location: '서울 종로구 화동 81-1 (삼청동)' }
        ] 
      },
      { 
        name: '부대찌개', 
        icon: '🍲', 
        restaurants: [
          { name: '오뎅식당 본점', location: '경기 의정부시 호국로1309번길 7' },
          { name: '이태원 바다식당', location: '서울 용산구 이태원로245' }
        ] 
      }
    ];

    let selectedFood = fullFoodDatabase[0];

    // [기능 1] 화면 전환
    function navigateTo(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));

      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }

    // [기능 2] 조건 설정 반영 필터
    function getFilteredFoodPool() {
      const yesterdayText = document.getElementById('input-yesterday').value.trim();
      const allergyText = document.getElementById('input-allergy').value.trim();
      const dislikeText = document.getElementById('input-dislike').value.trim();
      const likeText = document.getElementById('input-like').value.trim();

      const excludeKeywords = [
        ...yesterdayText.split(','),
        ...allergyText.split(','),
        ...dislikeText.split(',')
      ].map(k => k.trim()).filter(k => k.length > 0);

      const likeKeywords = likeText.split(',').map(k => k.trim()).filter(k => k.length > 0);

      let filteredPool = fullFoodDatabase.filter(food => {
        const isExcluded = excludeKeywords.some(kw => food.name.includes(kw));
        return !isExcluded;
      });

      if (filteredPool.length === 0) {
        filteredPool = [...fullFoodDatabase];
      }

      let finalPool = [];
      filteredPool.forEach(food => {
        finalPool.push(food);
        const isLiked = likeKeywords.some(kw => food.name.includes(kw));
        if (isLiked) {
          finalPool.push(food);
          finalPool.push(food);
        }
      });

      const statusElement = document.getElementById('filter-status-text');
      if (excludeKeywords.length > 0 || likeKeywords.length > 0) {
        statusElement.textContent = `🎯 조건 적용 중 (제외: ${excludeKeywords.length}개 / 선호: ${likeKeywords.length}개)`;
      } else {
        statusElement.textContent = `💡 조건 설정에 따라 후보 메뉴가 자동으로 조정됩니다.`;
      }

      return finalPool;
    }

    function applySettingsAndReturn() {
      getFilteredFoodPool();
      navigateTo('screen1');
    }

    // [기능 3] 룰렛 슬롯 뽑기
    function drawLunch() {
      const pool = getFilteredFoodPool();
      const slotItems = document.querySelectorAll('.slot-item');
      let count = 0;

      const interval = setInterval(() => {
        slotItems.forEach(item => {
          const randomFood = pool[Math.floor(Math.random() * pool.length)];
          item.children[0].textContent = randomFood.icon;
          item.children[1].textContent = randomFood.name;
        });

        count++;

        if (count > 15) {
          clearInterval(interval);

          const finalFood = pool[Math.floor(Math.random() * pool.length)];
          const centerSlot = document.getElementById('center-slot');
          centerSlot.children[0].textContent = finalFood.icon;
          centerSlot.children[1].textContent = finalFood.name;

          selectedFood = finalFood;

          document.getElementById('detail-food-icon').textContent = selectedFood.icon;
          document.getElementById('detail-food-name').textContent = selectedFood.name;
          renderRestaurants(selectedFood.restaurants);

          setTimeout(() => {
            navigateTo('screen3');
          }, 400);
        }
      }, 70);
    }

    // [기능 4] 맛집 이름과 위치(주소) 출력
    function renderRestaurants(restaurants) {
      const listContainer = document.getElementById('restaurant-list');
      listContainer.innerHTML = '';

      restaurants.forEach(place => {
        const card = document.createElement('div');
        card.className = 'restaurant-card';

        card.innerHTML = `
          <div class="restaurant-name">${place.name}</div>
          <div class="restaurant-location">📍 ${place.location}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    // 초기 맛집 목록 세팅
    renderRestaurants(selectedFood.restaurants);
  </script>
</body>
</html>
