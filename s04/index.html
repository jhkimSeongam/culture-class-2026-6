<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 복습</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- 제목 영역 -->
        <div class="top">
            <div>
                <h1>오늘의 복습</h1>
                <p>오늘 배운 걸 정리해보아요</p>
            </div>

            <button id="allBtn">전체보기</button>
        </div>


        <!-- 복습 작성 영역 -->
        <div class="review-box">

            <h2>오늘의 복습</h2>

            <textarea
                id="reviewInput"
                placeholder="오늘 배운 내용을 적어보세요."
            ></textarea>

            <button id="saveBtn" class="save-button">
                복습 저장하기
            </button>

        </div>


        <!-- 저장된 복습 -->
        <div id="reviewList" class="review-list"></div>

    </div>

    <!-- JavaScript 연결 -->
    <script src="script.js"></script>

</body>
</html>
